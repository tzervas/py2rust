# GitHub natively closes issues on merge for any base branch when PR uses Closes #n.
# This workflow reopens issues closed by merges into non-main branches so epics/tasks
# stay open until delivered to trunk.
#
# Exit honesty (scripts/reopen-linked-issues-off-main.sh):
#   GREEN — no closing keywords / already open / base=main leave-closed / reopens succeeded
#   RED   — self-test fail, API/auth fail, missing issue ref, or reopen PATCH didn't stick
# There is no always-green noop job.
name: reopen-issues-closed-off-main

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate (reopen path / dry classification)"
        type: string
        required: true
      dry_run:
        description: "Report actions without reopening"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reopen:
    name: Reopen issues closed off-main
    # ubuntu-latest: pure API bookkeeping; must not depend on self-hosted fleet capacity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test + classify/reopen (green only if real work succeeds)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
          DRY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/reopen-linked-issues-off-main.sh ]; then
            echo "::error::scripts/reopen-linked-issues-off-main.sh missing" >&2
            exit 1
          fi
          if [ -z "${PR}" ]; then
            echo "::error::no PR number in event payload" >&2
            exit 1
          fi
          args=(--pr "$PR")
          if [ "${DRY_INPUT}" = "true" ]; then
            args+=(--dry-run)
          fi
          bash scripts/reopen-linked-issues-off-main.sh "${args[@]}"

[project]
name = "py2rust"
version = "0.2.0"
description = "Python to Rust transpiler and code conversion assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astor>=0.8.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py2rust"]

[project.scripts]
py2rust = "py2rust.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.9.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=3.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "crates/**",
    "research/**",
    ".venv",
    "venv",
    # Transpiler INPUT, not project source. These snippets are deliberately
    # non-idiomatic — legacy `typing.List`/`Dict` (UP006/UP035), unused locals
    # (F841), unsorted imports (I001) — because the corpus measures what the
    # transpiler can express, and real-world Python is full of exactly these
    # shapes. Linting them measures ruff; auto-fixing them would silently
    # change the thing being measured. They are exercised by
    # scripts/expressibility_report.py and expressibility_corpus.rs instead.
    "tests/corpus/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
